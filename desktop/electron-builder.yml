# 墨尺桌面版打包配置（electron-builder）
# 发布：push v* tag → .github/workflows/release.yml 自动构建双平台并挂 Release。
# 未签名发布（用户已拍板）：mac 首次打开需右键 → 打开；Windows 过 SmartScreen 点「仍要运行」。
appId: io.github.yycqyjq.mochi-ruler
productName: 墨尺
directories:
  output: release
  buildResources: build
# 壳里只有主进程代码；评分核心是 extraResources 里的 PyInstaller sidecar
files:
  - main.js
  - package.json
extraResources:
  - from: sidecar
    to: sidecar
mac:
  # 只出 dmg：zip/blockmap/latest*.yml 都是 electron-updater 自动更新的配套，
  # 本应用未内置更新器，对下载者只是噪声（发布后由 workflow 清理步兜底删除）
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.productivity
  identity: null          # 明确跳过签名
  darkModeSupport: true
  artifactName: mochi-ruler-${version}-${arch}.${ext}  # 若中文包名在 CI 稳定，可改回 墨尺-${version}-${arch}
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: mochi-ruler-${version}-${arch}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: 墨尺
  differentialPackage: false  # 不生成差分更新用的 .blockmap

# tag 推送后直接发布为正式 Release（默认是 draft，需手动在 Releases 页点 Publish）
publish:
  provider: github
  releaseType: release
