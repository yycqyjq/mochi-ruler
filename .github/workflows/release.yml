# 墨尺桌面版发布：push v* tag 自动构建 macOS（arm64 + x64 dmg）
# 与 Windows（x64 NSIS 安装器），挂到 GitHub Release。
# 手动触发（Actions 页 run workflow）只构建不发布，产物挂 workflow artifacts，
# 用于正式打 tag 前空跑验证云端构建。
# 未签名发布：产物首次打开需右键 → 打开（mac）/ 过 SmartScreen（win），
# README「桌面版」一节有说明。
# 注：v1.0.0 等早期 tag 的树里没有本文件，推送它们不会触发任何构建，无需守卫。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            py: python3
          - os: windows-latest
            py: python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 评分核心冻结成单文件 sidecar（零依赖，PyInstaller 不用处理任何 pip 树）。
      # --add-data 把 static/ 一起打包（server 用 __file__ 定位，冻结后在
      # _MEIPASS 解包目录）；分隔符 mac/linux 是冒号、Windows 是分号。
      # --noconsole 仅 Windows 需要（避免 sidecar 弹控制台）；macOS 上该选项
      # 等价 --windowed 会产出 .app 包，sidecar 要的是裸可执行文件，故不加。
      - name: 打包后端 sidecar（PyInstaller）
        shell: bash
        run: |
          ${{ matrix.py }} -m pip install --upgrade pip pyinstaller
          sep=":"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            sep=";"
            ${{ matrix.py }} -m PyInstaller --onefile --noconsole \
              --name mochi-server --add-data "static${sep}static" server.py
          else
            ${{ matrix.py }} -m PyInstaller --onefile \
              --name mochi-server --add-data "static${sep}static" server.py
          fi
          mkdir -p desktop/sidecar
          cp dist/mochi-server* desktop/sidecar/
          chmod +x desktop/sidecar/mochi-server 2>/dev/null || true
          ls -la desktop/sidecar/

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        working-directory: desktop
        run: npm ci

      # package.json 里可能已经是对应版本（本地先对齐过），需 --allow-same-version，
      # 否则 npm 会以「Version not changed」报错。
      - name: 版本号对齐 tag
        if: github.event_name == 'push'
        working-directory: desktop
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # tag 推送 → 构建并发布到 GitHub Release；手动触发 → 只构建，产物
      # 挂 workflow artifacts 供下载验证。
      # GH_TOKEN 是 electron-builder 的首选令牌变量（publish 走它）；
      # GITHUB_TOKEN 同时保留作兜底。发布定位仓库靠 desktop/package.json
      # 的 repository 字段——缺它 publish 会直接报错（首轮失败的主因）。
      - name: 构建并发布到 GitHub Release
        if: github.event_name == 'push'
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish always

      # 手动触发（空跑验证）：完整构建 dmg / exe 但不发布，产物挂 workflow
      # artifacts 供下载核验（--dir 模式没有可验证的安装包）。
      - name: 构建但不发布（手动触发）
        if: github.event_name == 'workflow_dispatch'
        working-directory: desktop
        run: npx electron-builder --publish never

      # 签名兜底校验（macOS）：afterPack 已在打包时验过一遍，这里对成品
      # 再验一遍；未通过 ad-hoc 校验的应用下载后会被 Gatekeeper 判「已损坏」。
      - name: 校验 macOS 签名（兜底）
        if: runner.os == 'macOS'
        shell: bash
        working-directory: desktop
        run: |
          found=0
          for d in release/mac-arm64 release/mac; do
            [ -d "$d" ] || continue
            app=""
            for cand in "$d"/*.app; do
              [ -e "$cand" ] && app="$cand" && break
            done
            [ -n "$app" ] || { echo "no .app under $d"; exit 1; }
            found=1
            echo "== $app =="
            codesign --verify --deep --strict "$app"
            codesign -dv "$app" 2>&1 | grep -E 'Signature=|Identifier='
          done
          [ "$found" = 1 ] || { echo "no mac app dirs found"; exit 1; }

      - name: 上传构建产物（手动触发）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: mochi-desktop-${{ matrix.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe

# 发布后清理（独立作业）：等双平台都构建发布完，再统一清一遍——
# electron-builder 会顺带上传自动更新元数据（latest*.yml / *.blockmap / *.zip），
# 本应用未内置 electron-updater，这些对下载者只是噪声：删掉，只留 dmg / exe；
# 顺带把草稿转正式（正常已是正式，兜底）。
  cleanup:
    name: 清理冗余资产并转正式
    needs: build
    # 构建失败也跑（另一平台可能已发布成功）；整体取消则跳过
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: 删除自动更新元数据并转正式发布
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 按 tag 从 releases 列表定位（草稿状态下 releases/tags/ 会 404）
          rid=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq "first(.[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | .id)")
          if [ "$rid" = "null" ] || [ -z "$rid" ]; then
            echo "未找到 ${GITHUB_REF_NAME} 的 Release，跳过（构建是否成功以构建作业为准）"
            exit 0
          fi
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${rid}/assets?per_page=100" \
            --jq '.[] | select(.name | test("(blockmap|ya?ml|zip)$")) | .id')
          for id in $ids; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}"
          done
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${rid}" -F draft=false > /dev/null
          echo "清理完成，当前资产："
          gh api "repos/${GITHUB_REPOSITORY}/releases/${rid}" --jq '.assets[].name'
