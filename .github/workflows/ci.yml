# 墨尺 CI：无语料自测 + 编译检查（评分核心零依赖，任何环境可跑）。
# 深度体检（分离度 / 左尾 / 泛化）需要私有标杆语料，不进 CI，见 tools/audit.py。
# action 版本下限（Node 20 已弃用，须跑 node24 运行时）：checkout v5+ / setup-python v6+。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # 手动触发：排查时空跑用（无需推 commit）

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: 无语料自测
        run: python tools/selftest.py -v
      # 前端与文档的静态自检：CSS 变量未定义 / JS const 重新赋值 / 前端项数与
      # server.SHOW 不符。这三类都是**静默故障**（浏览器不报错、只是功能失效），
      # 2026-09-23 体检时各真实踩过一次，故纳入 CI。
      - name: 静态自检（前端 + 项数一致）
        run: python tools/static_check.py
      - name: 编译检查
        run: python -m compileall -q server.py qc_core.py tools
