# 墨尺 CI：无语料自测 + 编译检查（评分核心零依赖，任何环境可跑）。
# 深度体检（分离度 / 左尾 / 泛化）需要私有标杆语料，不进 CI，见 tools/audit.py。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 无语料自测
        run: python tools/selftest.py -v
      - name: 编译检查
        run: python -m compileall -q server.py qc_core.py tools
